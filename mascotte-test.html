<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mascotte — essai de marche</title>
<style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#173d43;background:#f6f5f0}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:850px;margin:auto}h1{font-size:clamp(24px,5vw,42px);margin:6px 0}p{line-height:1.5}.stage{height:320px;position:relative;overflow:hidden;border:2px solid #ced8d3;border-radius:24px;background:linear-gradient(175deg,#fff 0%,#f6f5f0 80%);margin:20px 0}.stage:before{content:'À LA UNE  ✦';position:absolute;left:22px;top:18px;font-size:22px;font-weight:900}.ground{position:absolute;bottom:40px;left:14px;right:14px;border-top:3px solid #c9d2cd}.walker{position:absolute;bottom:40px;left:18px;width:100px;height:150px;border:0;padding:0;background:none;cursor:pointer;transition:left 5s linear;will-change:left}.walker svg{width:100%;height:100%}.body{animation:bob .55s ease-in-out infinite alternate;transform-origin:56px 92px}.leg-l{animation:legA .55s ease-in-out infinite alternate;transform-origin:43px 100px}.leg-r{animation:legB .55s ease-in-out infinite alternate;transform-origin:69px 100px}.arm-l{animation:legB .55s ease-in-out infinite alternate;transform-origin:19px 68px}.arm-r{animation:legA .55s ease-in-out infinite alternate;transform-origin:91px 68px}.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}.paused .body,.paused .leg-l,.paused .leg-r,.paused .arm-l,.paused .arm-r,.paused .eye{animation-play-state:paused}.controls{display:flex;gap:10px;flex-wrap:wrap}button.control{border:1px solid #173d43;background:white;color:#173d43;border-radius:12px;padding:12px 18px;font-weight:750;font-size:16px;cursor:pointer;min-height:48px}.control.primary{background:#173d43;color:white}button:focus-visible{outline:3px solid #e7591c;outline-offset:3px}.status{font-weight:650} @keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(2px) rotate(1deg)}}@keyframes legA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}@keyframes legB{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@media(prefers-reduced-motion:reduce){.walker{transition:none}.body,.leg-l,.leg-r,.arm-l,.arm-r,.eye{animation:none}}
</style></head><body><main><p>LE LAB LINKEDIN · TEST INDÉPENDANT</p><h1>La mascotte marche 🚶</h1><p>Elle avance sur une ligne au sol, avec des jambes alternées et sans saut. Appuie sur la mascotte pour qu’elle te salue.</p><section class="stage" id="stage" aria-label="Animation d'une mascotte marchant au sol"><div class="ground"></div><button class="walker" id="walker" aria-label="Faire réagir la mascotte"><svg viewBox="0 0 110 145" aria-hidden="true"><ellipse cx="55" cy="141" rx="28" ry="4" fill="#173d43" opacity=".17"/><g class="leg-l"><path d="M43 97 L41 119 L33 123" fill="none" stroke="#173d43" stroke-width="6" stroke-linecap="round"/></g><g class="leg-r"><path d="M69 97 L70 119 L80 123" fill="none" stroke="#173d43" stroke-width="6" stroke-linecap="round"/></g><g class="body"><path d="M28 27 Q20 9 36 9 Q45 9 51 18 Q61 3 74 13 Q85 22 80 33 Q98 48 94 75 Q91 104 66 104 L39 104 Q13 98 14 70 Q11 46 28 27Z" fill="white" stroke="#173d43" stroke-width="4" stroke-linejoin="round"/><path class="arm-l" d="M18 67 Q4 77 6 62" fill="none" stroke="#173d43" stroke-width="5" stroke-linecap="round"/><path class="arm-r" d="M91 68 Q105 74 103 57" fill="none" stroke="#173d43" stroke-width="5" stroke-linecap="round"/><ellipse class="eye" cx="41" cy="56" rx="6" ry="10" fill="#173d43"/><ellipse class="eye" cx="70" cy="56" rx="6" ry="10" fill="#173d43"/><path d="M43 78 Q56 96 68 78 Q55 84 43 78" fill="#f18b36" stroke="#173d43" stroke-width="2.5"/></g></svg></button></section><div class="controls"><button class="control primary" id="toggle">⏸ Pause</button><button class="control" id="reset">↺ Recommencer</button><button class="control" id="hello">👋 Saluer</button></div><p class="status" id="status" role="status">La mascotte marche.</p><p>Version de test indépendante : aucun changement sur l’Observatoire V4.</p></main><script>
(()=>{const stage=document.getElementById('stage'),walker=document.getElementById('walker'),toggle=document.getElementById('toggle'),reset=document.getElementById('reset'),hello=document.getElementById('hello'),status=document.getElementById('status');let running=false,direction=1,timer;function move(){if(!running)return;const max=Math.max(18,stage.clientWidth-walker.offsetWidth-18);walker.style.left=(direction===1?max:18)+'px';walker.style.scale=direction===1?'1 1':'-1 1';direction*=-1;}function pause(){if(!running)return;const x=walker.getBoundingClientRect().left-stage.getBoundingClientRect().left;walker.style.transition='none';walker.style.left=Math.max(18,Math.min(x,stage.clientWidth-walker.offsetWidth-18))+'px';walker.offsetWidth;walker.style.transition='left 5s linear';running=false;clearInterval(timer);stage.classList.add('paused');toggle.textContent='▶ Marcher';status.textContent='La mascotte est en pause.'}function start(){if(running)return;running=true;stage.classList.remove('paused');toggle.textContent='⏸ Pause';status.textContent='La mascotte marche.';requestAnimationFrame(move);timer=setInterval(move,5200)}toggle.addEventListener('click',()=>running?pause():start());reset.addEventListener('click',()=>{pause();walker.style.transition='none';walker.style.left='18px';walker.style.scale='1 1';walker.offsetWidth;walker.style.transition='left 5s linear';direction=1;start()});function greet(){status.textContent='Coucou ! 👋';}hello.addEventListener('click',greet);walker.addEventListener('click',greet);if(matchMedia('(prefers-reduced-motion: reduce)').matches){stage.classList.add('paused');toggle.textContent='▶ Marcher';status.textContent='Animation arrêtée selon les préférences de ton appareil.'}else start();addEventListener('pagehide',()=>clearInterval(timer),{once:true})})();
</script></body></html>
